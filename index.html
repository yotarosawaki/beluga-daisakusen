<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ベルーガ だいさくせん</title>
<style>
  :root{
    --ink:#2b2d4a; --card:#fffdf7; --accent:#ff7a59; --sky:#4fa8ff; --gold:#ffcf3f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:linear-gradient(#1c2447,#3b3f7a);
    font-family:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    color:var(--ink); display:flex; justify-content:center; user-select:none; -webkit-user-select:none;
  }
  #wrap{width:min(100vw,calc((100vh - 200px) * 16 / 9),980px); min-width:320px; padding:10px 0 16px}
  /* HUD */
  #hud{display:flex; gap:10px; align-items:center; margin-bottom:8px; color:#fff; font-weight:800}
  .chip{background:rgba(255,255,255,.16); border-radius:999px; padding:6px 14px; font-size:clamp(14px,2.6vw,22px); white-space:nowrap}
  #timebar{flex:1; height:16px; background:rgba(255,255,255,.2); border-radius:999px; overflow:hidden}
  #timebar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#63e6be,#ffd43b); transition:width .1s linear}
  #timebar.low i{background:linear-gradient(90deg,#ff6b6b,#ffa94d)}
  #muteBtn{background:none;border:none;font-size:22px;cursor:pointer;color:#fff}
  /* Stage */
  #stage{
    position:relative; width:100%; aspect-ratio:16/9; container-type:inline-size; overflow:hidden;
    border-radius:18px; background:linear-gradient(#3f4b8a 0 60%,#5e4e79 60%); box-shadow:0 8px 24px rgba(0,0,0,.4);
    transition:box-shadow .2s;
  }
  #stage.danger{box-shadow:0 0 0 4px #ff4d4d, 0 0 30px 6px rgba(255,60,60,.6)}
  #stage.shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .abs{position:absolute}
  #window{left:47%;top:5%;width:15%;height:25%;background:#101a45;border:1cqw solid #c9a06a;border-radius:1.5cqw;font-size:4cqw;display:flex;align-items:center;justify-content:center}
  #headboard{left:1%;top:24%;width:4%;height:72%;background:#8a5a3c;border-radius:1.5cqw}
  #bed{left:2.5%;top:36%;width:77%;height:60%;background:#e9efff;border-radius:2cqw;border-bottom:1.6cqw solid #b7c3ee}
  #parent{left:4%;top:12%;width:37%}
  #parent svg{width:100%;display:block;overflow:visible}
  .head{transform-origin:180px 140px;transition:transform .35s}
  [data-state=away] .head{transform:rotate(-9deg) translateX(-8px)}
  [data-state=watch] .head{transform:rotate(3deg)}
  .e-closed,.e-half,.e-open,.brow-angry,.brow-worry,.m-o,.m-flat,.m-big{display:none}
  [data-state=sleep] .e-closed,[data-state=warn] .e-half,[data-state=watch] .e-open,[data-state=away] .e-open,[data-state=scold] .e-open{display:inline}
  [data-state=watch] .brow-angry,[data-state=scold] .brow-angry{display:inline}
  [data-state=warn] .brow-worry{display:inline}
  [data-state=sleep] .m-o,[data-state=away] .m-o{display:inline}
  [data-state=warn] .m-flat,[data-state=watch] .m-flat{display:inline}
  [data-state=scold] .m-big{display:inline}
  .pupil{transition:transform .2s}
  [data-state=away] .pupil{transform:translate(-8px,-5px)}
  [data-state=watch] .pupil{transform:translate(6px,5px)}
  [data-state=watch] #eyeglow{display:inline}
  #eyeglow{display:none}
  #bubble{left:3%;top:3%;max-width:42%;background:#fff;color:var(--ink);border-radius:2cqw;padding:1cqw 2cqw;font-size:2.6cqw;font-weight:800;box-shadow:0 .4cqw 0 rgba(0,0,0,.15)}
  #bubble.warn{background:#fff3bf}
  #bubble.watch{background:#ffc9c9;color:#b02525}
  #bubble.scold{background:#ff8787;color:#fff}
  /* Belugas */
  .beluga{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation}
  .beluga svg{width:100%;display:block;filter:drop-shadow(0 .6cqw .4cqw rgba(0,0,0,.25));pointer-events:none}
  .beluga.s{width:10cqw}.beluga.m{width:14cqw}.beluga.l{width:19cqw}
  .beluga.pop-in{animation:popin .4s}
  @keyframes popin{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
  .beluga.carrying{animation:wig .35s infinite alternate;z-index:5}
  .beluga.carrying svg{filter:drop-shadow(0 0 1cqw #ffe066)}
  @keyframes wig{from{transform:translate(-50%,-50%) rotate(-5deg)}to{transform:translate(-50%,-50%) rotate(5deg)}}
  .beluga.fly{transition:transform .5s ease-in,opacity .5s;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;animation:none}
  .beluga.hasprog{z-index:5}
  .beluga.snap{transition:left .4s ease-out,top .4s ease-out}
  /* どろぼうっ子 */
  .kid{position:absolute;left:-6cqw;bottom:-14%;width:7cqw;display:none;pointer-events:none}
  .beluga.hasprog .kid{display:block;animation:sneak .5s infinite alternate}
  .kid svg{overflow:visible}
  .kid .l1,.kid .l2{transform-box:fill-box;transform-origin:50% 0;animation:step .25s infinite alternate}
  .kid .l2{animation-direction:alternate-reverse}
  @keyframes step{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
  @keyframes sneak{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-.8cqw) rotate(3deg)}}
  .sneak{position:absolute;top:-2.4cqw;left:-1cqw;font-size:1.7cqw;font-weight:900;color:#fff;text-shadow:0 .2cqw 0 #000;white-space:nowrap}
  /* ランキング */
  .rank{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:.4cqw 2.4cqw;margin:1.2cqw 0;text-align:left;font-size:2.1cqw;font-weight:800}
  .row{display:flex;gap:1cqw;padding:.3cqw 1cqw;border-radius:1cqw;min-width:24cqw}
  .row.me{background:#ffe066}
  .row .i{width:3cqw;text-align:center}.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.empty{opacity:.35}
  #nameIn{font-family:inherit;font-weight:800;font-size:2.8cqw;text-align:center;width:26cqw;padding:.6cqw 1cqw;border:.3cqw solid #b7c3ee;border-radius:1.4cqw;color:var(--ink)}
  .btns{display:flex;gap:2cqw;justify-content:center}
  .big.hard{background:#e03131;box-shadow:0 .7cqw 0 #a61e1e}
  .big .small{display:block;font-size:1.8cqw !important;font-weight:700;opacity:.9}
  .tab{font-family:inherit;font-weight:800;font-size:2.2cqw;padding:.5cqw 2.4cqw;border:none;border-radius:999px;background:#dfe4f7;color:var(--ink);cursor:pointer}
  .tab.on{background:var(--sky);color:#fff}
  .big.sub{background:#6c7bd9;box-shadow:0 .7cqw 0 #4a57a8}
  .small{font-size:1.9cqw !important;opacity:.75}
  .pts{position:absolute;top:-4%;left:50%;transform:translateX(-50%);background:var(--gold);border-radius:999px;padding:0 1cqw;font-size:1.9cqw;font-weight:900;white-space:nowrap;box-shadow:0 .3cqw 0 rgba(0,0,0,.2)}
  .bar{position:absolute;left:12%;right:12%;bottom:-10%;height:1.3cqw;background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:#63e6be}
  .beluga.hasprog .bar{display:block}
  /* Door / room */
  #door{left:82%;top:6%;width:16.5%;height:88%;background:#7a4a2b;border-radius:2cqw 2cqw 0 0;padding:1cqw}
  #doorsign{background:#fff;border-radius:1cqw;font-size:1.9cqw;font-weight:900;text-align:center;padding:.4cqw 0;margin-bottom:1cqw}
  #room{position:relative;height:calc(100% - 4.6cqw);background:linear-gradient(#ffe9b8 0 70%,#d9a86c 70%);border-radius:1cqw;overflow:hidden}
  #room svg{position:absolute;width:5.2cqw}
  /* Pops */
  .pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:3.4cqw;color:#fff;text-shadow:0 .3cqw 0 rgba(0,0,0,.4);pointer-events:none;animation:up 1.1s forwards;z-index:9;white-space:nowrap}
  @keyframes up{to{transform:translate(-50%,-260%);opacity:0}}
  /* Overlay */
  #overlay{position:absolute;inset:0;background:rgba(15,20,50,.72);display:flex;align-items:center;justify-content:center;z-index:20}
  #card{background:var(--card);border-radius:3cqw;padding:3cqw 4cqw;text-align:center;max-width:82%;box-shadow:0 1cqw 0 rgba(0,0,0,.25)}
  #card h1{margin:0 0 1cqw;font-size:4.4cqw}
  #card p{margin:.6cqw 0;font-size:2.4cqw;line-height:1.5;font-weight:700}
  .big{margin-top:1.6cqw;font-family:inherit;font-weight:900;font-size:3cqw;padding:1cqw 4cqw;border:none;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 .7cqw 0 #c4452a}
  .big:active{transform:translateY(.5cqw);box-shadow:0 .2cqw 0 #c4452a}
  /* Tools */
  #tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .tool{position:relative;overflow:hidden;font-family:inherit;background:#fffdf7;border:none;border-radius:16px;padding:8px 4px;cursor:pointer;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
  .tool .e{display:block;font-size:clamp(26px,5.5vw,44px);line-height:1.1}
  .tool b{display:block;font-size:clamp(12px,2.2vw,18px)}
  .tool small{display:block;font-size:clamp(10px,1.8vw,14px);opacity:.7;font-weight:700}
  .tool .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(40,40,80,.55);pointer-events:none}
  .tool.wait{filter:grayscale(.6)}
  .tool kbd{position:absolute;top:4px;left:8px;font-size:11px;opacity:.5}
  #hint{color:#dfe6ff;text-align:center;font-size:clamp(11px,2vw,15px);margin-top:10px;font-weight:700}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="chip">⭐ <span id="score">0</span></div>
    <div id="timebar"><i></i></div>
    <div class="chip">⏰ <span id="time">60</span></div>
    <button id="muteBtn" title="おと">🔊</button>
  </div>

  <div id="stage" data-state="sleep">
    <div id="window" class="abs">🌙✨</div>
    <div id="headboard" class="abs"></div>
    <div id="bed" class="abs"></div>

    <div id="parent" class="abs" data-state="sleep">
      <svg viewBox="0 0 360 300">
        <ellipse cx="180" cy="130" rx="155" ry="100" fill="#ffffff"/>
        <g class="head">
          <circle cx="180" cy="125" r="68" fill="#ffd9b8"/>
          <path d="M110 118 C106 46 254 46 250 118 C232 88 204 82 180 84 C156 82 128 88 110 118Z" fill="#5a3a2a"/>
          <circle cx="140" cy="140" r="9" fill="#ff9eb5" opacity=".55"/>
          <circle cx="220" cy="140" r="9" fill="#ff9eb5" opacity=".55"/>
          <g class="brow-angry" stroke="#3b2418" stroke-width="7" stroke-linecap="round"><path d="M128 96 L166 108"/><path d="M232 96 L194 108"/></g>
          <g class="brow-worry" stroke="#3b2418" stroke-width="6" stroke-linecap="round" fill="none"><path d="M130 100 Q148 88 166 98"/><path d="M230 100 Q212 88 194 98"/></g>
          <g class="e-closed" stroke="#3b2418" stroke-width="6" stroke-linecap="round" fill="none"><path d="M132 124 Q148 136 166 124"/><path d="M194 124 Q212 136 228 124"/></g>
          <g class="e-half">
            <ellipse cx="149" cy="124" rx="15" ry="7" fill="#fff" stroke="#3b2418" stroke-width="3"/><circle cx="149" cy="125" r="5" fill="#3b2418"/>
            <ellipse cx="211" cy="124" rx="15" ry="7" fill="#fff" stroke="#3b2418" stroke-width="3"/><circle cx="211" cy="125" r="5" fill="#3b2418"/>
          </g>
          <g class="e-open">
            <ellipse cx="149" cy="124" rx="16" ry="18" fill="#fff" stroke="#3b2418" stroke-width="3"/><circle class="pupil" cx="149" cy="126" r="8" fill="#3b2418"/>
            <ellipse cx="211" cy="124" rx="16" ry="18" fill="#fff" stroke="#3b2418" stroke-width="3"/><circle class="pupil" cx="211" cy="126" r="8" fill="#3b2418"/>
            <g id="eyeglow" stroke="#ff4d4d" stroke-width="4" stroke-linecap="round"><path d="M116 96 L104 86"/><path d="M244 96 L256 86"/><path d="M180 66 L180 52"/></g>
          </g>
          <g class="m-o"><ellipse cx="180" cy="164" rx="8" ry="6" fill="#c0584a"/></g>
          <g class="m-flat"><path d="M164 166 L196 166" stroke="#a0403a" stroke-width="6" stroke-linecap="round"/></g>
          <g class="m-big"><ellipse cx="180" cy="168" rx="16" ry="12" fill="#a0403a"/></g>
        </g>
        <path d="M14 196 C70 170 130 176 180 190 C230 176 290 170 346 196 L356 300 L4 300Z" fill="#ff9eb5"/>
        <path d="M40 220 Q180 200 320 220 M30 250 Q180 232 330 250" stroke="#ffc4d3" stroke-width="8" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="bubble" class="abs">すぅ…すぅ…💤</div>

    <div id="door" class="abs">
      <div id="doorsign">🚪 じぶんのへや</div>
      <div id="room"></div>
    </div>

    <div id="overlay">
      <div id="card"></div>
    </div>
  </div>

  <div id="tools"></div>
  <div id="hint">おやが「じーっ👀」とみているときにベルーガをはこぶと、みつかっちゃう！ どうぐで きをそらそう</div>
</div>

<script>
(() => {
  const GAME_TIME = 60;
  const SIZES = { s:{pts:1, need:0.8, label:'ちいさい'}, m:{pts:3, need:1.8, label:'ふつう'}, l:{pts:5, need:3.0, label:'おおきい'} };
  const TOOLS = [
    { emoji:'🔔', name:'おもちゃのすず', dur:1.5, cd:7 },
    { emoji:'📱', name:'スマホのおと',   dur:2.5, cd:12 },
    { emoji:'🐱', name:'ねこのなきごえ', dur:3.5, cd:20 },
  ];
  const SLOTS = [{x:52,y:52},{x:70,y:52},{x:52,y:80},{x:70,y:80}];
  const BUBBLE = {
    sleep: () => 'すぅ…すぅ…💤',
    warn:  () => 'ん…？ うーん…',
    watch: () => 'じーっ！👀',
    away:  () => `あれ？ ${TOOLS[P.tool]?.emoji||''} なんだろう？`,
    scold: () => 'こらっ！ ねなさい！',
  };
  const BELUGA_SVG = (() => {
    const shapes = `<ellipse cx="62" cy="42" rx="46" ry="26"/><ellipse cx="96" cy="32" rx="19" ry="17"/><path d="M22 38 C10 40 4 30 2 20 C12 22 18 26 28 32Z"/><path d="M22 44 C10 48 4 58 4 64 C14 60 20 54 30 48Z"/>`;
    return `<svg viewBox="0 0 120 72"><g fill="none" stroke="#8fb8d8" stroke-width="5" stroke-linejoin="round">${shapes}</g>
      <g fill="#fbfdff">${shapes}</g>
      <ellipse cx="66" cy="58" rx="12" ry="5" fill="#e3effa" stroke="#8fb8d8" stroke-width="2" transform="rotate(-15 66 58)"/>
      <circle cx="100" cy="40" r="3.2" fill="#22304a"/><circle cx="101" cy="39" r="1" fill="#fff"/>
      <path d="M96 49 Q106 56 115 46" stroke="#22304a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="90" cy="48" r="4" fill="#ffb3c6" opacity=".7"/></svg>`;
  })();

  const KID_SVG = `<svg viewBox="0 0 60 100">
      <rect class="l1" x="18" y="70" width="10" height="24" rx="3" fill="#222"/><rect class="l2" x="32" y="70" width="10" height="24" rx="3" fill="#222"/>
      <rect x="16" y="42" width="28" height="32" rx="7" fill="#fff" stroke="#222" stroke-width="2"/>
      <g fill="#222"><rect x="16" y="48" width="28" height="4"/><rect x="16" y="57" width="28" height="4"/><rect x="16" y="66" width="28" height="4"/></g>
      <path d="M40 50 L58 62" stroke="#222" stroke-width="7" stroke-linecap="round"/><circle cx="58" cy="62" r="4" fill="#ffd9b8"/>
      <circle cx="30" cy="28" r="15" fill="#ffd9b8"/>
      <rect x="14" y="23" width="32" height="9" rx="4.5" fill="#111"/><circle cx="24" cy="27.5" r="2.6" fill="#fff"/><circle cx="36" cy="27.5" r="2.6" fill="#fff"/>
      <path d="M14 20 Q30 -6 46 20 Z" fill="#222"/><circle cx="30" cy="4" r="4" fill="#e03131"/>
    </svg>`;
  const DOOR = { x:90, y:72 };
  const NAME_KEY = 'beluga_name';
  const LEVELS = { easy:{label:'かんたん', key:'beluga_rank_easy'}, hard:{label:'むずかしい', key:'beluga_rank_hard'} };

  const $ = s => document.querySelector(s);
  const stage = $('#stage'), parentEl = $('#parent'), bubble = $('#bubble'), overlay = $('#overlay'), card = $('#card'), room = $('#room');
  const rand = (a,b) => a + Math.random()*(b-a);
  const pickSize = () => { const r = Math.random(); return r < .5 ? 's' : r < .82 ? 'm' : 'l'; };

  // ---- sound ----
  let ac = null, muted = false;
  function beep(f, d=.12, type='sine', v=.07, delay=0){
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
    } catch(e){}
  }
  $('#muteBtn').onclick = e => { muted = !muted; e.target.textContent = muted ? '🔇' : '🔊'; };

  // ---- state ----
  let level = 'easy';
  let mode = 'title', t = GAME_TIME, score = 0, carry = null, last = 0;
  const P = { state:'sleep', left:3, tool:0 };
  const slots = SLOTS.map(p => ({ ...p, alive:false, rt:0, size:'s', prog:0, el:null }));
  const cds = TOOLS.map(() => 0);

  function setParent(s, dur){
    P.state = s; P.left = dur;
    parentEl.dataset.state = s;
    stage.classList.toggle('danger', s === 'watch');
    bubble.textContent = BUBBLE[s]();
    bubble.className = 'abs ' + s;
  }
  function nextParent(){
    const f = Math.min(1, Math.max(0, (GAME_TIME - t) / GAME_TIME));
    switch (P.state){
      case 'sleep': setParent('warn', Math.max(.6, 1.0 - .4*f)); beep(440,.15,'triangle',.05); break;
      case 'warn':  setParent('watch', rand(1.5, 2.5) + f*.6); beep(220,.2,'sawtooth',.04); break;
      case 'watch': setParent('sleep', rand(2.2, 4.2) - 1.2*f); break;
      case 'away':  setParent('sleep', rand(1.2, 2.2)); break;
      case 'scold': setParent('sleep', 2.2); break;
    }
  }

  // ---- belugas ----
  function makeBeluga(slot){
    const size = pickSize();
    Object.assign(slot, { size, prog:0, alive:true });
    const b = document.createElement('button');
    b.className = `beluga ${size} pop-in`;
    b.style.left = slot.x + '%'; b.style.top = slot.y + '%';
    b.innerHTML = `${BELUGA_SVG}<span class="pts">⭐${SIZES[size].pts}</span><div class="bar"><i></i></div><div class="kid">${KID_SVG}<span class="sneak">そろ〜り</span></div>`;
    b.addEventListener('pointerdown', e => { e.preventDefault(); toggleCarry(slot); });
    stage.appendChild(b);
    slot.el = b;
  }
  function toggleCarry(slot){
    if (mode !== 'play' || !slot.alive) return;
    carry = (carry === slot) ? null : slot;
    if (carry) beep(660,.08,'sine',.05);
  }
  function deliver(slot){
    carry = null; slot.alive = false; slot.rt = rand(3,5);
    const pts = SIZES[slot.size].pts; score += pts;
    const el = slot.el;
    el.classList.remove('carrying','pop-in'); el.classList.add('fly');
    el.style.left = DOOR.x + '%'; el.style.top = DOOR.y + '%';
    setTimeout(() => el.remove(), 550);
    pop(`+${pts}⭐`, slot.x, slot.y - 12, '#ffe066');
    addToRoom(slot.size);
    [660,880,1100].forEach((f,i) => beep(f,.14,'triangle',.06,i*.08));
    $('#score').textContent = score;
  }
  function addToRoom(size){
    const s = document.createElement('div');
    s.innerHTML = BELUGA_SVG;
    const svg = s.firstChild;
    const sc = {s:.7,m:1,l:1.4}[size];
    svg.style.left = rand(0,60) + '%'; svg.style.bottom = rand(2,30) + '%';
    svg.style.width = (5.2*sc) + 'cqw'; svg.style.transform = `scaleX(${Math.random()<.5?1:-1})`;
    room.appendChild(svg);
    if (room.children.length > 24) room.firstChild.remove();
  }
  function pop(text, x, y, color){
    const p = document.createElement('div');
    p.className = 'pop'; p.textContent = text; p.style.left = x + '%'; p.style.top = y + '%';
    if (color) p.style.color = color;
    stage.appendChild(p); setTimeout(() => p.remove(), 1100);
  }
  function caught(){
    if (carry){
      const el = carry.el; el.classList.add('snap'); setTimeout(() => el.classList.remove('snap'), 450);
      carry.prog = 0; carry = null;
    }
    if (score > 0){
      score = 0; $('#score').textContent = 0;
      room.innerHTML = '';
      pop('ぜんぶ とりあげられた…！', 45, 40, '#ff8787');
    } else pop('みつかった！', 45, 40, '#ff8787');
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    setParent('scold', 1.6);
    beep(150,.4,'sawtooth',.08);
  }

  // ---- tools ----
  const toolsEl = $('#tools');
  TOOLS.forEach((tl,i) => {
    const b = document.createElement('button');
    b.className = 'tool';
    b.innerHTML = `<kbd>${i+1}</kbd><span class="e">${tl.emoji}</span><b>${tl.name}</b><small>${tl.dur}びょう そらす／${tl.cd}びょうまち</small><i class="cd"></i>`;
    b.addEventListener('pointerdown', e => { e.preventDefault(); useTool(i); });
    toolsEl.appendChild(b);
  });
  function useTool(i){
    if (mode !== 'play' || level !== 'easy' || cds[i] > 0) return;
    const tl = TOOLS[i];
    cds[i] = tl.cd;
    P.tool = i;
    const dur = (P.state === 'away') ? Math.max(P.left, tl.dur) : tl.dur;
    setParent('away', dur);
    [880,1320,880].forEach((f,k) => beep(f,.1,'sine',.06,k*.09));
  }
  window.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const i = '123'.indexOf(e.key); if (i >= 0) useTool(i); });

  // ---- loop ----
  function frame(now){
    requestAnimationFrame(frame);
    const dt = Math.min(.1, (now - last) / 1000 || 0); last = now;
    if (mode !== 'play') return;

    t -= dt;
    P.left -= dt; if (P.left <= 0) nextParent();
    if (carry && P.state === 'watch') caught();

    slots.forEach(s => {
      if (s.alive){
        const need = SIZES[s.size].need;
        if (carry === s){ s.prog += dt; if (s.prog >= need){ deliver(s); return; } }
        else s.prog = Math.max(0, s.prog - dt*.7);
        const k = Math.min(1, s.prog / need);
        s.el.style.left = (s.x + (DOOR.x - s.x) * k) + '%';
        s.el.style.top  = (s.y + (DOOR.y - s.y) * k) + '%';
        s.el.classList.toggle('carrying', carry === s);
        s.el.classList.toggle('hasprog', s.prog > 0);
        s.el.querySelector('.bar i').style.width = Math.min(100, s.prog / need * 100) + '%';
      } else if ((s.rt -= dt) <= 0) makeBeluga(s);
    });

    cds.forEach((c,i) => {
      cds[i] = Math.max(0, c - dt);
      const b = toolsEl.children[i];
      b.querySelector('.cd').style.height = (cds[i] / TOOLS[i].cd * 100) + '%';
      b.classList.toggle('wait', cds[i] > 0);
    });

    const tt = Math.max(0, t);
    $('#time').textContent = Math.ceil(tt);
    $('#timebar i').style.width = (tt / GAME_TIME * 100) + '%';
    $('#timebar').classList.toggle('low', tt < 10);
    if (t <= 0) finish();
  }
  requestAnimationFrame(frame);

  // ---- screens ----
  function start(lv){
    level = lv === 'hard' ? 'hard' : 'easy';
    toolsEl.style.display = level === 'easy' ? 'grid' : 'none';
    $('#hint').textContent = level === 'easy'
      ? 'おやが「じーっ👀」とみているときにベルーガをはこぶと、ぜんぶ とりあげられちゃう！ どうぐで きをそらそう'
      : '【むずかしい】どうぐは つかえない！ おやが「ん…？」と なったら すぐタップで とまろう。みつかると ぜんぶ とりあげられるよ';
    slots.forEach(s => { s.el && s.el.remove(); s.alive = false; s.el = null; s.rt = 0; });
    room.innerHTML = '';
    slots.forEach(makeBeluga);
    cds.fill(0); carry = null; score = 0; t = GAME_TIME;
    $('#score').textContent = 0;
    setParent('sleep', 3);
    overlay.style.display = 'none';
    mode = 'play';
    beep(523,.1,'triangle'); beep(784,.15,'triangle',.07,.1);
  }
  function rank(s){
    if (s >= 40) return ['🏆','ベルーガマスター！'];
    if (s >= 25) return ['🥷','ベルーガにんじゃ！'];
    if (s >= 12) return ['🐳','ベルーガみならい'];
    return ['🌊','もういっかい ちょうせん！'];
  }
  // ---- ranking (この端末の中に保存) ----
  const loadRank = lv => {
    try {
      let raw = localStorage.getItem(LEVELS[lv].key);
      if (raw == null && lv === 'easy') raw = localStorage.getItem('beluga_rank_v1');   // 前のバージョンの記録
      const r = JSON.parse(raw); return Array.isArray(r) ? r : [];
    } catch(e){ return []; }
  };
  const saveRank = (lv, l) => { try { localStorage.setItem(LEVELS[lv].key, JSON.stringify(l)); } catch(e){} };
  const qualifies = (lv, sc) => { const l = loadRank(lv); return sc > 0 && (l.length < 10 || sc > l[l.length-1].score); };
  function addRank(lv, name, sc){
    const l = loadRank(lv), me = { name, score: sc };
    l.push(me);
    l.sort((a,b) => b.score - a.score);   // 同点は先に登録した人が上
    const idx = l.indexOf(me);
    saveRank(lv, l.slice(0,10));
    return idx;
  }
  function rankEl(lv, hi){
    const l = loadRank(lv), box = document.createElement('div');
    box.className = 'rank';
    for (let i = 0; i < 10; i++){
      const r = l[i], row = document.createElement('div');
      row.className = 'row' + (i === hi ? ' me' : '') + (r ? '' : ' empty');
      const ic = document.createElement('span'); ic.className = 'i'; ic.textContent = ['🥇','🥈','🥉'][i] || (i+1);
      const n = document.createElement('span'); n.className = 'n'; n.textContent = r ? r.name : '---';
      const p = document.createElement('span'); p.textContent = r ? r.score + '点' : '';
      row.append(ic, n, p); box.appendChild(row);
    }
    return box;
  }
  function finish(){
    mode = 'over'; carry = null;
    stage.classList.remove('danger');
    [523,659,784,1046].forEach((f,i) => beep(f,.2,'triangle',.06,i*.12));
    const [ic, title] = rank(score);
    const lv = level, top = loadRank(lv)[0];
    const head = `<h1>${ic} ${title}</h1><p>【${LEVELS[lv].label}】ベルーガを ${score} ポイント つれてこれたよ！${top && score > top.score ? ' 🎉 1いだ！' : ''}</p>`;
    overlay.style.display = 'flex';
    if (!qualifies(lv, score)) return showResult(head, lv, -1);

    let last = ''; try { last = localStorage.getItem(NAME_KEY) || ''; } catch(e){}
    card.innerHTML = `${head}<p>ランキングに のったよ！ なまえを いれてね</p>
      <input id="nameIn" maxlength="8" placeholder="あだな">
      <p class="small">ほんとうのなまえや じゅうしょは いれないでね</p>
      <button class="big" id="regBtn">とうろく</button>`;
    const inp = $('#nameIn'); inp.value = last;
    const reg = () => {
      const name = inp.value.trim().slice(0,8) || 'ななしさん';
      try { localStorage.setItem(NAME_KEY, name); } catch(e){}
      showResult(head, lv, addRank(lv, name, score));
    };
    $('#regBtn').onclick = reg;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') reg(); });
  }
  function showResult(head, lv, hi){
    card.innerHTML = `${head}<div id="rk"></div><div class="btns"><button class="big" id="againBtn">もういっかい</button><button class="big sub" id="menuBtn">タイトルへ</button></div>`;
    $('#rk').appendChild(rankEl(lv, hi));
    $('#againBtn').onclick = () => start(lv);
    $('#menuBtn').onclick = title;
  }
  function showRanking(lv = 'easy'){
    card.innerHTML = `<h1>🏆 ランキング</h1>
      <div class="btns"><button class="tab${lv==='easy'?' on':''}" data-lv="easy">かんたん</button><button class="tab${lv==='hard'?' on':''}" data-lv="hard">むずかしい</button></div>
      <div id="rk"></div><button class="big sub" id="backBtn">もどる</button>`;
    $('#rk').appendChild(rankEl(lv, -1));
    card.querySelectorAll('.tab').forEach(b => b.onclick = () => showRanking(b.dataset.lv));
    $('#backBtn').onclick = title;
  }
  function title(){
    card.innerHTML = `<h1>🐳 ベルーガ だいさくせん</h1>
      <p>ねているおやから、ベルーガのぬいぐるみを<br>そーっと じぶんのへやに つれていこう！</p>
      <p>👆 ベルーガを タップで はこびはじめ<br>👀 おやが「じーっ」のときは ぜったいダメ！<br>😱 みつかると あつめたベルーガが ぜんぶ とりあげられる！</p>
      <p>⭐ ちいさい=1　⭐ ふつう=3　⭐ おおきい=5</p>
      <div class="btns"><button class="big" id="easyBtn">🔔 かんたん<br><span class="small">どうぐが つかえる</span></button><button class="big hard" id="hardBtn">🔥 むずかしい<br><span class="small">どうぐなし</span></button></div>
      <button class="big sub" id="rankBtn" style="font-size:2.2cqw">🏆 ランキング</button>`;
    $('#easyBtn').onclick = () => start('easy');
    $('#hardBtn').onclick = () => start('hard');
    $('#rankBtn').onclick = () => showRanking();
  }
  title();
})();
</script>
</body>
</html>
